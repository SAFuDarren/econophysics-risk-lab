   <text style="font-weight: 700; font-size: 11.4px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start" x="28.512" y="21.259512" transform="rotate(-0 28.512 21.259512)">The restriction adds no benefit over the same-map pressure control</text>
  </g>
  <g id="text_29">
   <text style="font-size: 8.4px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #7b858f" x="28.512" y="41.75543" transform="rotate(-0 28.512 41.75543)">Paired relative loss reduction; the full primary family contains 12 budget/control contrasts</text>
  </g>
  <g id="text_30">
   <text style="font-size: 8.1px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #7b858f" x="41.472" y="289.98" transform="rotate(-0 41.472 289.98)">Whiskers: individual 95% basic paired block intervals, scaled by reference mean. Holm tests remain in the tables.</text>
  </g>
  <g id="text_31">
   <text style="font-size: 8.1px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #7b858f" x="41.472" y="306.18" transform="rotate(-0 41.472 306.18)">A better point score against direct flow does not establish a benefit from the nonlinear, sign-constrained mechanism.</text>
  </g>
 </g>
